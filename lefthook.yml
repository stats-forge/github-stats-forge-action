# Hooks are installed by `prepare`, which pnpm runs after every install.
pre-commit:
  # `test` reads what `format` rewrote, so the order matters.
  piped: true
  jobs:
    - name: format
      glob: '*.{js,jsx,ts,tsx,json,jsonc,yaml,yml,md}'
      # `--no-error-on-unmatched-pattern`: a commit touching only the bundle
      # stages files `ignorePatterns` excludes.
      # That is not a reason to reject it.
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      # a file oxfmt rewrote goes into the same commit, not left dirty
      stage_fixed: true

    - name: lint
      glob:
        - 'src/**/*.ts'
        - 'tests/**/*.ts'
        - '*.config.ts'
      run: pnpm exec oxlint {staged_files}

    - name: build
      glob:
        - 'src/**'
        - 'esbuild.config.ts'
        - 'package.json'
        - 'pnpm-lock.yaml'
      # the bundle ships from the repo, so it belongs in the commit that changed it
      run: pnpm run build && git add dist/

    - name: test
      run: pnpm test
