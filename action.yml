name: GitHub Stats Forge Action
description: Generate GitHub stats cards in GitHub Actions.
author: stats-forge

inputs:
  card:
    description: Card type to generate (stats, top-langs, pin, wakatime, gist).
    required: true
  options:
    description: Options for the card (query string or JSON).
    required: false
    default: ''
  path:
    description: Output path for SVG file (relative path; include filename with .svg).
    required: false
    default: ''
  token:
    description: GitHub token (PAT or GITHUB_TOKEN).
    required: false
    default: ''

outputs:
  path:
    description: Path where the SVG file was written.

runs:
  using: node24
  main: dist/index.js

branding:
  icon: bar-chart-2
  color: purple
