name: GitHub Stats Forge Action
description: Generate GitHub stats cards in GitHub Actions.
author: stats-forge

branding:
  icon: bar-chart-2
  color: blue

inputs:
  card:
    description: Card type to generate (stats, top-langs, pin, wakatime, gist, contributed-to, org, org-activity).
    required: true
  options:
    description: Options for the card (query string or JSON).
    required: false
    default: ''
  path:
    description: Output path for the SVG, including the filename.
    required: true
  token:
    description: GitHub token. Defaults to github.token, enough for public data; private repositories and gists need a PAT.
    required: false
    default: ${{ github.token }}

outputs:
  path:
    description: Path where the SVG file was written.

runs:
  using: node24
  main: dist/index.js
