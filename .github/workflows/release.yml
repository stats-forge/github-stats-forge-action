name: Release

# Changesets keeps a version PR open with the pending bump and changelog.
# Merging it is what tags and publishes.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false
  # queue every push: without it, a newer run replaces the waiting one and that release is skipped
  queue: max

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    environment: release

    runs-on: ubuntu-26.04

    timeout-minutes: 10

    permissions:
      contents: read # the app token, not GITHUB_TOKEN, does the writing

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs['published-packages'] }}

    steps:
      # GITHUB_TOKEN events start no workflows, so CI would never run on the version PR.
      - name: Create release helper token
        id: release-helper
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}
          permission-contents: write # pushes the release branch, tags and releases
          permission-pull-requests: write # opens and updates the release PR

      # Full history, so Changesets finds the commit that added each changeset.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@2c28f768b03ce332a96804ae076f15c84f239684 # v4.0.2
        with:
          save-cache: false

      # `dist/` is not committed, so `pnpm release` commits this build for the tag.
      - name: Build the bundle
        run: pnpm run build

      # Opens or updates the version PR, or, when that PR has just landed, runs
      # `pnpm release` and creates the GitHub release for the tag it pushed.
      # Publishing is what starts the workflows that move `v0` and pin the README.
      - name: Changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          GITHUB_TOKEN: ${{ steps.release-helper.outputs.token }} # `pnpm release` commits through the API
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          # A conventional subject, like the rest of the history.
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          # `CHANGELOG.md` is no longer exempt from the formatter, and the
          # version PR has to pass the same CI as everything else.
          version-script: pnpm run changeset:version
          publish-script: pnpm run release

  # Its own job, so a comment that fails is a red job to re-run rather than an error swallowed
  # inside a green release: the tag is already out by the time it runs.
  comment:
    name: Comment
    environment: release # where the release helper's credentials live

    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    permissions:
      contents: read # required to check out the repository

    steps:
      # The app's token, not the default one: it carries issues:write, and the comments
      # then come from the same bot that opened the version PR.
      - name: Create release helper token
        id: release-helper
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}
          permission-contents: read # finds the PRs a commit shipped in
          permission-pull-requests: write # comments on shipped PRs
          permission-issues: write # comments on the issues those PRs close

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the commenter reads the history before the release commit

      - name: Comment on shipped PRs and issues
        uses: marcalexiei/changesets-release-commenter@05af9622283286a660465ac50f552b7f4151377e # v0.4.0
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          published-packages: ${{ needs.release.outputs.publishedPackages }}
