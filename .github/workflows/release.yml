name: Release

# Changesets keeps a version PR open with the pending bump and changelog.
# Merging it is what tags and publishes.
# `workflow_run` is limited to main, and the job checks the head repository, so
# no fork PR reaches it.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Release
    environment: release

    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: read # the app token, not GITHUB_TOKEN, does the writing

    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs['published-packages'] }}

    steps:
      # GITHUB_TOKEN events start no workflows, so CI would never run on the version PR.
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@b24da7e3c0e4a66a97cb28e39499c37873a593b7 # v2.3.0
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      # Full history, so `changeset git-tag` sees the tags already released.
      # Credentials are persisted on purpose: `pnpm release` pushes the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-helper.outputs.token }}

      - name: Configure git user for GitHub App
        env:
          BOT_NAME: ${{ steps.release-helper.outputs.bot-name }}
          BOT_EMAIL: ${{ steps.release-helper.outputs.bot-email }}
        run: |
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_EMAIL}"

      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@b24da7e3c0e4a66a97cb28e39499c37873a593b7 # v2.3.0

      # `dist/` is not committed, so `pnpm release` commits this build onto the tag.
      - name: Build the bundle
        run: pnpm run build

      # Opens or updates the version PR, or, when that PR has just landed, runs
      # `pnpm release` and creates the GitHub release for the tag it pushed.
      # Publishing is what starts the workflows that move `v0` and pin the README.
      - name: Changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          # A conventional subject, like the rest of the history.
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          # `CHANGELOG.md` is no longer exempt from the formatter, and the
          # version PR has to pass the same CI as everything else.
          version-script: pnpm run changeset:version
          publish-script: pnpm run release

  # Its own job, so a comment that fails is a red job to re-run rather than an error swallowed
  # inside a green release: the tag is already out by the time it runs.
  comment:
    name: Comment
    environment: release # where the release helper's credentials live

    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}

    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: read # required to check out the repository

    steps:
      # The app's token, not the default one: it carries issues:write, and the comments
      # then come from the same bot that opened the version PR.
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@b24da7e3c0e4a66a97cb28e39499c37873a593b7 # v2.3.0
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0 # the commenter reads the history before the release commit

      - name: Comment on shipped PRs and issues
        uses: marcalexiei/changesets-release-commenter@80366b79332f7311aa9be1679c6abfbe75d73f0e # v0.2.2
        with:
          github-token: ${{ steps.release-helper.outputs.token }}
          published-packages: ${{ needs.release.outputs.publishedPackages }}

  on-ci-fail:
    name: 'Failure'
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Report the skipped release
        run: echo "CI failed. Release will not run"
