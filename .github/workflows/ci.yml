name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  code-checks:
    name: Code checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1

      # `dist/` is not committed, and `tests/dist.spec.ts` runs it.
      - name: Build the bundle
        run: pnpm run build

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # `--format=github` turns findings into annotations on the diff.
      - name: Lint
        run: pnpm run lint:oxlint:ci

      - name: Unused files, exports and dependencies
        run: pnpm run lint:knip

      - name: Test
        run: pnpm run test

  action:
    name: Action renders a card
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@e9655755a6dc0040e650a931ee5d958c7d7a9f22 # v2.3.1

      # `./` below runs the workspace copy, so it needs the bundle built here.
      # `$/` cannot: it fetches this commit, which no longer carries one.
      - name: Build the bundle
        run: pnpm run build

      - name: Generate stats card
        id: generate
        uses: ./ # zizmor: ignore[self-repository]
        with:
          card: stats
          options: username=octocat
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # A render failure already fails the step above.
      # This guards the case that stays silent: a file that is not an SVG.
      - name: Assert an SVG was written
        env:
          CARD_PATH: ${{ steps.generate.outputs.path }}
        run: grep -q "<svg" "${CARD_PATH}"
        shell: bash

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - code-checks
      - action
    steps:
      - name: Exit with error if some jobs are not successful
        run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
