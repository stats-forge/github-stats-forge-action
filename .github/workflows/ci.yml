name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  code-checks:
    name: Code checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: marcalexiei/github-actions/setup-node-and-pnpm@e3b04865510c657477cc722854b31a3b74c72c09 # v2.2.0

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # `--format=github` turns findings into annotations on the diff.
      - name: Lint
        run: pnpm run lint:oxlint:ci

      - name: Unused files, exports and dependencies
        run: pnpm run lint:knip

      # The committed bundle must match the sources it was built from.
      # Otherwise the action ships code nobody reviewed.
      # Built before the tests, so the bundle they exercise is this commit's.
      - name: Build the bundle
        run: pnpm run build

      - name: Fail if dist/ is stale
        # `--intent-to-add` stages the paths without their content, putting a
        # never-committed dist/ into the diff.
        # Plain `git diff` sees only tracked files, so it would pass on a bundle
        # that was never added.
        run: |
          git add --intent-to-add dist/
          git diff --exit-code --stat -- dist/ || {
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            exit 1
          }

      - name: Test
        run: pnpm run test

  action:
    name: Action renders a card
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate stats card
        id: generate
        uses: ./
        with:
          card: stats
          options: username=octocat
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # A render failure already fails the step above.
      # This guards the case that stays silent: a file that is not an SVG.
      - name: Assert an SVG was written
        run: grep -q "<svg" "${{ steps.generate.outputs.path }}"
        shell: bash

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - code-checks
      - action
    steps:
      - name: Exit with error if some jobs are not successful
        run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'skipped') || contains(needs.*.result, 'cancelled')) }}
