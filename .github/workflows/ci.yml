name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-checks:
    name: Code checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint:knip

      # The committed bundle must match the sources it was built from, or the
      # action ships code nobody reviewed. Build before the tests, so the
      # bundle they exercise is this commit's.
      - run: pnpm build
      - name: Fail if dist/ is stale
        # `--intent-to-add` stages the paths without their content, which puts
        # a never-committed dist/ into the diff. Plain `git diff` sees only
        # tracked files, so it would pass on a bundle that was never added.
        run: |
          git add --intent-to-add dist/
          git diff --exit-code --stat -- dist/ || {
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            exit 1
          }

      - run: pnpm test

  action:
    name: Action renders a card
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats card
        id: generate
        uses: ./
        with:
          card: stats
          options: username=octocat
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # A render failure already fails the step above, so this guards the case
      # that stays silent: a file written that is not actually an SVG.
      - name: Assert an SVG was written
        run: grep -q "<svg" "${{ steps.generate.outputs.path }}"
        shell: bash
