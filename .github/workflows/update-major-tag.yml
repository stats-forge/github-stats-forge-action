name: Update major tag
run-name: Move ${{ inputs.major_version || 'the major tag' }} to ${{ inputs.target || github.event.release.tag_name }}

# The README tells people to pin `@v0`.
# Release-please only creates the exact-version tag, so the floating major is
# moved here: automatically on a release, by hand to roll a bad one back.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      major_version:
        description: Which major tag to move
        required: true
        type: choice
        options:
          - v0
          - v1
          - v2
      target:
        description: The release to point it at, e.g. v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  update-major-tag:
    name: Update major tag
    environment: release

    # A prerelease must not move the tag everyone is pinned to.
    # Null, and so allowed, on a dispatch.
    if: ${{ !github.event.release.prerelease }}

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      # The same bot release.yml uses, for the same reason: GITHUB_TOKEN is not
      # guaranteed to be able to write here.
      - name: Setup release helper
        id: release-helper
        uses: marcalexiei/github-actions/setup-github-app-user-bot@e3b04865510c657477cc722854b31a3b74c72c09 # v2.2.0
        with:
          app-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      # Credentials are persisted on purpose: the push below needs them.
      # This doubles as a rollback tool, so keep the pin a release or two back.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          token: ${{ steps.release-helper.outputs.token }}
          fetch-depth: 0

      - name: Move the major tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_MAJOR: ${{ inputs.major_version }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          tag="${INPUT_TARGET:-$RELEASE_TAG}"
          major="${INPUT_MAJOR:-${tag%%.*}}"

          # One pattern, two guarantees: the target is a vX.Y.Z release tag, and
          # it is on the major being moved. A dispatch can fail both; a release
          # derives the major from the tag, so it can only fail the first.
          case "${tag}" in
            "${major}".[0-9]*.[0-9]*) ;;
            *)
              [ -z "${INPUT_TARGET}" ] || {
                echo "::error::${tag} is not a ${major}.x.y release tag."
                exit 1
              }
              echo "::notice::${tag} is not a release tag, so there is no major to move."
              exit 0
              ;;
          esac

          # A lightweight tag needs no git identity.
          # `^{}` resolves an annotated target to its commit, and force covers
          # create, move and no-op alike.
          git tag -f "${major}" "${tag}^{}"
          git push -f origin "refs/tags/${major}"

          echo "::notice::${major} now points at $(git rev-parse "${major}") (${tag})."
