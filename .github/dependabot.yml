version: 2

updates:
  # Keeps the pinned SHAs in `.github/workflows` current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # A release that is pulled in its first week never reaches a workflow here.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Conventional subjects, so release-please reads them.
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    # Dev only: a runtime bump rewrites `dist/`, which Dependabot cannot rebuild.
    allow:
      - dependency-type: development
    ignore:
      # `engines` decides which major this runs on, so the types follow it rather than lead.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
