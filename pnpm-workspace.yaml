# No `packages:` key: this repo ships a single package.
# The file exists for the settings below, shared with `github-stats-forge`.

# The bundle ships from the repo, so a range would let `dist/` and the manifest
# disagree about what was built.
savePrefix: ''

# `onlyBuiltDependencies` in pnpm 10; renamed and turned into a map in 11.
allowBuilds:
  # Fetches a platform binary from a postinstall script.
  # Without this, pnpm skips it and `pnpm build` has no esbuild to run.
  esbuild: true
  lefthook: true

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# The cooling-off period catches a compromised upstream publish.
# It buys nothing against our own packages, and would hold the action three days
# behind every release we make ourselves.
minimumReleaseAgeExclude:
  - '@stats-forge/github-stats-forge-core'
  - '@marcalexiei/oxfmt-config'
  - '@marcalexiei/oxlint-config'

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
