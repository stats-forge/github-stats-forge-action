# No `packages:` key: this repo ships a single package. The file exists for the
# settings below, which are shared with `stats-forge/github-stats-forge`.

# `onlyBuiltDependencies` in pnpm 10; renamed and turned into a map in 11.
allowBuilds:
  # Fetches a platform binary from a postinstall script; without this, pnpm
  # skips it and `pnpm build` has no esbuild to run.
  esbuild: true
  lefthook: true

# Deliberately stricter than pnpm's 1440 default (3 days vs 1)
minimumReleaseAge: 4320

# The cooling-off period is there to catch a compromised upstream publish. It
# buys nothing against our own packages, and would otherwise hold the action
# three days behind every release we make ourselves.
minimumReleaseAgeExclude:
  - '@stats-forge/*'

# Reject a version with weaker publish trust evidence than an earlier one.
trustPolicy: no-downgrade

# Fail on unmet peers and on a Node version outside `engines`, instead of warning
strictPeerDependencies: true
engineStrict: true
